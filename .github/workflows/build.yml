
name: Build VST3 (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Visual Studio
        shell: pwsh
        run: |
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022"

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $plugin = "build/VoxForge_artefacts/Release/VST3/VoxForge.vst3"

          if (!(Test-Path $plugin)) {
            Write-Error "No se encontró VoxForge.vst3"
            Get-ChildItem build -Recurse -Directory
            exit 1
          }

          Copy-Item -Recurse $plugin dist/

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VoxForge-VST3-Windows
          path: dist/
          if-no-files-found: error
